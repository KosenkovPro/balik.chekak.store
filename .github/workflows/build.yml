name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run common unit tests (JVM)
        run: ./gradlew :composeApp:desktopTest --stacktrace

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # На разных образах раннера cmdline-tools лежат то в `cmdline-tools/latest/bin`,
      # то в версионированном каталоге, поэтому ищем `sdkmanager` поиском по файлу.
      - name: Install Android SDK packages
        run: |
          set -eu
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -path '*/bin/*' 2>/dev/null | sort | tail -n1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager не найден в $SDK_ROOT" >&2
            exit 1
          fi
          echo "Используем $SDKMANAGER"
          # `yes` ловит SIGPIPE, когда sdkmanager закрывает stdin, — это норма,
          # поэтому код возврата именно этой строки игнорируем.
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      # Контекст `secrets` недоступен в `if` на уровне шага, поэтому секреты
      # передаём через `env`, а проверку делаем уже внутри скрипта.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_BASE64 не задан — сборка пойдёт с отладочной подписью"
          fi

      - name: Set up signing secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_PASSWORD не задан — сборка пойдёт с отладочной подписью"
          fi

      - name: Build release APK
        run: ./gradlew :composeApp:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CheKak-Buck-Android
          path: composeApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    needs: test
    # iOS-таргет ещё не портирован под Kotlin/Native: в commonMain остались
    # JVM-only вызовы (System.currentTimeMillis, Math, String.format), а в
    # iosMain — недописанные PDFKit/Vision-части. Джоб запускается, чтобы
    # было видно прогресс, но не роняет весь воркфлоу: релизный Android-APK
    # собирается и проверяется независимо от него.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Generate Xcode config
        run: ./gradlew :iosApp:xcodeConfig

      - name: Build iOS app (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/iosApp.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "CheKak-Buck-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CheKak-Buck-iOS
          path: ${{ runner.temp }}/CheKak-Buck-unsigned.ipa
          if-no-files-found: error
